name: Build Aseprite for Windows

on:
  push:
    branches:
      - 'codex/aseprite-*'

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'mall1/aseprite'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Download matching Skia
        shell: bash
        run: |
          skia_url="$(bash laf/misc/skia-url.sh release windows x64)"
          curl --fail --location --retry 3 --ssl-revoke-best-effort \
            --output skia.zip "$skia_url"
          unzip -q skia.zip -d skia

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_CCACHE=OFF `
            -DENABLE_SCRIPTING=ON `
            -DENABLE_TESTS=OFF `
            -DLAF_BACKEND=skia `
            "-DSKIA_DIR=$env:GITHUB_WORKSPACE/skia" `
            "-DSKIA_LIBRARY_DIR=$env:GITHUB_WORKSPACE/skia/out/Release-x64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build

      - name: Check executable and encrypt portable package
        shell: pwsh
        working-directory: build/bin
        env:
          ASEPRITE_ARTIFACT_PASSWORD: ${{ secrets.ASEPRITE_ARTIFACT_PASSWORD }}
        run: |
          if (-not $env:ASEPRITE_ARTIFACT_PASSWORD) {
            throw 'Set the ASEPRITE_ARTIFACT_PASSWORD repository secret before packaging.'
          }
          if (-not (Test-Path -LiteralPath data -PathType Container)) {
            throw 'The application data directory is missing.'
          }

          $process = Start-Process -FilePath .\aseprite.exe -ArgumentList '--version' -Wait -NoNewWindow -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

          # This public repository exposes workflow artifacts to signed-in users.
          $archive = Join-Path $env:RUNNER_TEMP 'aseprite-windows-x64.7z'
          & "$env:ProgramFiles\7-Zip\7z.exe" a -mhe=on "-p$env:ASEPRITE_ARTIFACT_PASSWORD" $archive aseprite.exe data

      - uses: actions/upload-artifact@v7
        with:
          name: aseprite-windows-x64-encrypted
          path: ${{ runner.temp }}/aseprite-windows-x64.7z
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

